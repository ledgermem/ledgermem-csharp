name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore test/LedgerMem.Tests.csproj
      - run: dotnet build test/LedgerMem.Tests.csproj --no-restore -c Release
      - run: dotnet test test/LedgerMem.Tests.csproj --no-build -c Release --verbosity normal
